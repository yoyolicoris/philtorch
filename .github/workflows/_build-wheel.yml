name: Build wheel (reusable)

# Called once per OS from build-wheels.yml, which gives each OS its own job id
# so downstream jobs can depend on a single OS's build. Each call builds one
# abi3 wheel.
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      torch_version:
        # The torch to build against, e.g. '2.12.1': the floor.
        required: true
        type: string
      python_version:
        # The Python to build on, e.g. '3.11': the oldest supported, as its
        # abi3 wheel serves every later Python too.
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # fetch-depth: 0 required so setuptools_scm can read full
          # git history and tags to derive the package version number.

      - uses: actions/setup-python@v7
        with:
          # The interpreter cibuildwheel runs on, not the wheels' (CIBW_BUILD);
          # cibuildwheel 4 needs Python 3.11 or newer.
          python-version: "3.13"

      - name: Configure native build environment (macOS)
        # cibuildwheel builds macOS wheels on the runner (no container), so
        # env vars set here reach the build subprocess.
        if: runner.os == 'macOS'
        run: |
          # 14.0 floor: the MPS Metal kernels need a newer Metal/MPS runtime
          # than the arm64 Big Sur (11.0) default. See README.
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      - name: Install cibuildwheel
        # 4.2.0 or later builds CPython 3.15 by default. Free-threaded builds
        # are on by default too, but CIBW_BUILD below names only regular ones.
        run: pip install cibuildwheel==4.3.5

      - name: Select the Python to build on
        # Expressions have no string replace: "3.11" becomes "cp311-*".
        shell: bash
        run: echo "CIBW_BUILD=cp${PYTHON_VERSION/./}-*" >> "$GITHUB_ENV"
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          # CIBW_BUILD, the Python to build on, is set by the step above.
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # CPython's default flags include -g, and on Linux the debug info
          # lands in _C itself (about 36 of its 37 MB). Strip it at link time:
          # LDFLAGS is appended to the link command, whereas a CXXFLAGS
          # override would replace Python's flags, -O3 included.
          CIBW_ENVIRONMENT_LINUX: LDFLAGS="$LDFLAGS -Wl,--strip-debug"
          # torch (+ setuptools) are installed into the build env by
          # CIBW_BEFORE_BUILD, so disable build isolation; otherwise setup.py
          # can't `import torch` and silently builds an extension-less wheel.
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          # macOS CPU wheels on the PyTorch index aren't `+cpu`-suffixed, so
          # add the suffix only off-macOS (resolved via runner.os).
          CIBW_BEFORE_BUILD: >-
            pip install "setuptools>=77.0.3" "setuptools_scm>=8" wheel &&
            pip install torch==${{ inputs.torch_version }}${{ runner.os != 'macOS' && '+cpu' || '' }} --index-url https://download.pytorch.org/whl/cpu
          CIBW_TEST_SKIP: "*"
          # torch's libs are excluded from repair: torch is a separate runtime
          # dep (never vendored), and `import torch` loads them globally before
          # philtorch._C, so the extension resolves them at runtime. Without
          # -e, auditwheel/delocate abort not finding them on the build image.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --exclude 'libtorch*.so*' --exclude 'libc10*.so*' -w {dest_dir} {wheel}
          # --ignore-missing-dependencies: the extension names torch's libs by
          # @rpath with no rpath of its own, so delocate can't find their
          # files; they resolve at runtime to the copies `import torch` loaded.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            delocate-wheel --require-archs {delocate_archs} -e libtorch -e libc10 --ignore-missing-dependencies -w {dest_dir} -v {wheel}
          # cibuildwheel 4 repairs Windows wheels with delvewheel by default,
          # which would bundle torch's DLLs; leave them to torch, as above.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ inputs.os }}
          path: wheelhouse/*.whl
