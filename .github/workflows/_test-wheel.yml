name: Test wheel (reusable)

# Called once per (OS, Torch version) leg from build-wheels.yml. Each leg
# installs the OS's one wheel with its own torch, which may be a later minor
# than the one the wheel was built on: that is the check that the wheel,
# built on the stable ABI, loads there.
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python_versions:
        # JSON array string of the Pythons to test, e.g. '["3.11", "3.15"]'
        # (see resolve-torch-versions in build-wheels.yml).
        required: true
        type: string
      torch_version:
        # The torch to test with, installed here. Not necessarily the one the
        # wheel was built on (see the header).
        required: true
        type: string
      upload_coverage:
        # Set true only for the one leg that should upload Codecov coverage
        # (newest Torch on ubuntu), to avoid duplicate reports per commit; it
        # uploads from the first, oldest Python of python_versions.
        required: false
        type: boolean
        default: false
    secrets:
      codecov_token:
        required: false

jobs:
  test:
    # Reuses the wheel already built by build-wheels rather than recompiling
    # from source, to save CI time.
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python_versions) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ inputs.os }}
          path: wheelhouse

      - name: Install wheel and test dependencies
        # Runs under bash on every OS (Windows uses bundled Git Bash). Torch is
        # installed without the "+cpu" suffix on macOS, matching
        # CIBW_BEFORE_BUILD in _build-wheel.yml.
        shell: bash
        run: |
          shopt -s nullglob
          WHEELS=(wheelhouse/philtorch-*-abi3-*.whl)
          if [ "${#WHEELS[@]}" -ne 1 ]; then
            echo "Expected exactly one abi3 wheel in wheelhouse/, found ${#WHEELS[@]}: ${WHEELS[*]}" >&2
            exit 1
          fi

          pip install torch==${{ inputs.torch_version }}${{ runner.os != 'macOS' && '+cpu' || '' }} --index-url https://download.pytorch.org/whl/cpu

          # Vendored torchlpc is now bundled in philtorch._C; no separate pip install.
          # Keep --no-deps since torch is already present.
          pip install --no-deps "${WHEELS[0]}"
          pip install numpy scipy pytest pytest-cov

      - name: Test with pytest
        run: pytest --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage reports to Codecov
        if: inputs.upload_coverage && matrix.python-version == fromJson(inputs.python_versions)[0]
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.codecov_token }}

      - name: Upload test results to Codecov
        # Per-test durations and failures, for Codecov's test analytics; also
        # when tests fail.
        if: ${{ !cancelled() && inputs.upload_coverage && matrix.python-version == fromJson(inputs.python_versions)[0] }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.codecov_token }}
          report_type: test_results
          files: junit.xml
