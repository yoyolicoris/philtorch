name: Build CUDA wheels

# Builds one Linux CUDA wheel, abi3, per CUDA major (cu12, cu13), uploads them
# as CI artifacts and GPU-tests them. A release or a dev push runs it as a job
# of build-wheels.yml (github.event_name is then `release` or `push`), which
# attaches the wheels to the release, or to the rolling `cuda-dev` pre-release,
# once every CPU and CUDA check has passed.
#
# Design notes:
# - `scripts/torch_matrix.py legs` resolves the legs from torch_matrix.json,
#   the single source of truth, including the build image. The workflow
#   hardcodes no torch, CUDA or image versions.
# - Each leg builds in the matrix's manylinux image, the same glibc 2.28
#   environment the CPU wheels build in, with only the CUDA packages the build
#   needs installed from NVIDIA's RHEL 8 repository. No GPU runner is needed:
#   nvcc cross-compiles, and PHILTORCH_FORCE_CUDA=1 tells setup.py to take the
#   CUDA path without a visible GPU (see build_support.py).
# - `auditwheel repair --plat <platform>` is a fail-loud conformance gate, and
#   a check step then rejects bundled CUDA or torch libraries and leftover
#   debug info.
# - A GPU job per cuda_tests leg then installs that leg's torch from its index
#   and the wheel of its CUDA major with --no-deps, on that leg's Python, on a
#   Modal GPU, and runs the CUDA tests against it (scripts/modal_smoke_test.py).
# - Pull requests and dev pushes build every wheel and GPU-test one: the wheel
#   of the newest torch's newest CUDA, on that torch. A pull request runs only
#   when a file of the `paths` list below changes. A dev push always builds
#   the wheels, which build-wheels.yml publishes as the development index, but
#   GPU-tests only if it changed such a file (scripts/cuda_paths_changed.py
#   reads the list from this file). Releases and manual dispatches GPU-test
#   every (torch, CUDA) pair in the matrix.

on:
  pull_request:
    branches: ["dev"]
    paths:
      - ".github/workflows/build-cuda-wheels.yml"
      - "torch_matrix.json"
      - "scripts/torch_matrix.py"
      - "scripts/cuda_paths_changed.py"
      - "philtorch/_build_check.py"
      - "scripts/modal_smoke_test.py"
      - "setup.py"
      - "build_support.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "philtorch/csrc/**"
      - "third_party/**"
      # The Triton kernels, named _*_kernels.py, the recurrence operator that
      # launches them, the native ops' registered backwards, the alignment
      # and HMM modules, which run only on CUDA, and every test module the
      # GPU job runs (-m cuda), which tests/test_ci_paths.py checks.
      - "philtorch/**/_*_kernels.py"
      - "philtorch/_recur.py"
      - "philtorch/_ops.py"
      - "philtorch/align/*.py"
      - "philtorch/estimation/hmm.py"
      - "tests/conftest.py"
      - "tests/test_align_ctc.py"
      - "tests/test_align_dtw.py"
      - "tests/test_docstrings_cuda.py"
      - "tests/test_estimation_hmm.py"
      - "tests/test_estimation_kalman.py"
      - "tests/test_interp.py"
      - "tests/test_pt2_comp.py"
      - "tests/test_pt2_vendored_compile.py"
      - "tests/test_recur.py"
      - "tests/test_recur_ext.py"
      - "tests/test_torchlpc_vendored.py"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its previous run's expensive
# builds. Each dev push has a group of its own, as in build-wheels.yml, so its
# run is never cancelled. When build-wheels.yml calls this workflow,
# github.workflow is its name, so the group is spelled out.
concurrency:
  group: build-cuda-wheels-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-legs:
    runs-on: ubuntu-latest
    outputs:
      build_image: ${{ steps.legs.outputs.build_image }}
      platform: ${{ steps.legs.outputs.platform }}
      cuda_builds: ${{ steps.legs.outputs.cuda_builds }}
      cuda_tests: ${{ steps.legs.outputs.cuda_tests }}
      gpu_test: ${{ steps.paths.outputs.gpu_test }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The history and tags, to diff a push against the cuda-dev tag.
          fetch-depth: 0

      - name: Resolve the legs
        id: legs
        run: python3 scripts/torch_matrix.py legs --event "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"

      - name: Check whether the GPU test is needed
        id: paths
        # Against the commit whose wheels the cuda-dev pre-release holds,
        # which build-wheels.yml moves the tag to when it publishes them.
        run: |
          BASE=$(git rev-parse -q --verify "refs/tags/cuda-dev^{commit}" || true)
          python3 scripts/cuda_paths_changed.py --event "$GITHUB_EVENT_NAME" \
            --base "$BASE" --sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build:
    # A name of its own: GitHub would otherwise list every matrix value, the
    # index URL and arch list included.
    name: build ${{ matrix.label }}
    needs: resolve-legs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-legs.outputs.cuda_builds) }}
    container:
      image: ${{ needs.resolve-legs.outputs.build_image }}
    env:
      CUDA_HOME: /usr/local/cuda-${{ matrix.cuda }}
      TORCH_INDEX_URL: ${{ matrix.index_url }}
      TORCH_CUDA_ARCH_LIST: ${{ matrix.arch_list }}
    steps:
      - name: Install CUDA toolkit
        # Only nvcc and the headers the build includes (cudart, CCCL, CRT). The
        # CUDA runtime libraries come from the matching torch install. CCCL is
        # not named: cudart-devel requires it, and from CUDA 13.3 its package
        # is cccl-<V>, not cuda-cccl-<V>.
        run: |
          curl -fsSL -o /etc/yum.repos.d/cuda-rhel8.repo \
            https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
          V=$(echo "${{ matrix.cuda }}" | tr . -)
          dnf install -y -q "cuda-nvcc-$V" "cuda-cudart-devel-$V" "cuda-crt-$V"
          echo "$CUDA_HOME/bin" >> "$GITHUB_PATH"

      # The container runs as root while the workspace belongs to the runner
      # user, so git (used by actions/checkout and setuptools_scm) must be told
      # to trust it.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v7
        with:
          # Full history so setuptools_scm can derive the base version.
          fetch-depth: 0

      - name: Set up Python
        # The manylinux image ships every CPython under /opt/python, with
        # headers, plus auditwheel and patchelf.
        run: |
          PY=cp$(echo "${{ matrix.python }}" | tr -d .)
          "/opt/python/${PY}-${PY}/bin/python" -m venv /opt/venv
          echo /opt/venv/bin >> "$GITHUB_PATH"

      - name: Install build dependencies
        # ninja lets torch's extension build compile MAX_JOBS files at once.
        run: |
          pip install -q -U pip
          pip install -q "setuptools>=77.0.3" "setuptools_scm>=8" wheel packaging ninja
          pip install -q "torch==${{ matrix.torch }}" --index-url "$TORCH_INDEX_URL"

      - name: Compute wheel version
        id: version
        run: |
          VERSION="$(python -m setuptools_scm)+${{ matrix.label }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build wheel
        env:
          PHILTORCH_FORCE_CUDA: "1"
          MAX_JOBS: "4"
          # The image puts clang first on PATH; build with its GCC toolset,
          # which is what nvcc supports as a host compiler.
          CC: gcc
          CXX: g++
          # CPython's default flags include -g. Strip the debug info at link
          # time, as the CPU wheels do (LDFLAGS is appended, whereas CFLAGS
          # would replace Python's flags, -O3 included).
          LDFLAGS: -Wl,--strip-debug
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PHILTORCH: ${{ steps.version.outputs.version }}
        # --no-build-isolation so setup.py can `import torch`; without it the
        # build silently produces an extension-less wheel (same reason the CPU
        # workflow passes it to cibuildwheel). --no-deps keeps pip from also
        # writing torch and its CUDA wheels into wheelhouse/.
        run: pip wheel . --no-build-isolation --no-deps -w wheelhouse/

      - name: Repair wheel
        # torch and the CUDA runtime are excluded: the matching torch install
        # provides and loads them, so the wheel must not ship its own copies.
        run: |
          auditwheel repair \
            --plat "${{ needs.resolve-legs.outputs.platform }}" \
            --exclude "libtorch*.so*" --exclude "libc10*.so*" --exclude "libcudart.so*" \
            -w repaired/ wheelhouse/philtorch-*.whl

      - name: Check wheel
        run: |
          WHEEL=$(ls repaired/*.whl)
          auditwheel show "$WHEEL"
          mkdir check && python -m zipfile -e "$WHEEL" check/
          if ls check/philtorch.libs 2>/dev/null | grep -E '^lib(cud|nv|cublas|torch|c10)'; then
            echo "::error::$WHEEL bundles CUDA or torch libraries"
            exit 1
          fi
          if readelf -S check/philtorch/_C*.so | grep -q '\.debug_info'; then
            echo "::error::$WHEEL still carries debug info"
            exit 1
          fi
          pip install -q twine
          twine check --strict "$WHEEL"
          ls -l "$WHEEL"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: cuda-wheels-${{ matrix.label }}
          path: repaired/*.whl

  gpu-test:
    # Runs the CUDA tests against the exact wheel built above for the leg's
    # CUDA major, on a Modal GPU.
    name: GPU test ${{ matrix.label }}, torch ${{ matrix.torch }}, CUDA ${{ matrix.cuda }}
    needs: [resolve-legs, build]
    # Repository secrets are not available to pull requests from forks. A dev
    # push that changed none of the `paths` above builds only.
    if: >
      needs.resolve-legs.outputs.gpu_test == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-legs.outputs.cuda_tests) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: cuda-wheels-${{ matrix.label }}
          path: wheel/

      - name: Run CUDA tests on a Modal GPU
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SMOKE_PYTHON: ${{ matrix.python }}
          SMOKE_TORCH: ${{ matrix.torch }}
          SMOKE_TORCH_INDEX_URL: ${{ matrix.index_url }}
          # T4 (sm_75) is Modal's cheapest GPU and our oldest target
          # architecture. Set the MODAL_GPU repository variable to use another.
          SMOKE_GPU: ${{ vars.MODAL_GPU || 'T4' }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Set the MODAL_TOKEN_ID and MODAL_TOKEN_SECRET repository secrets"
            exit 1
          fi
          pip install -q "modal>=1,<2"
          # Modal rate-limits app creation, and every leg creates its app at
          # the same moment. Retry only when the app was never created, after
          # a randomised wait so the legs spread out; once Modal prints
          # "Initialized", a failure is a real one.
          set -o pipefail
          for ATTEMPT in 1 2 3 4 5; do
            if modal run scripts/modal_smoke_test.py --wheel wheel/*.whl 2>&1 | tee modal.log; then
              exit 0
            fi
            if grep -q "Initialized. View run at" modal.log ||
              ! grep -q "App create rate limit exceeded" modal.log; then
              exit 1
            fi
            [ "$ATTEMPT" -lt 5 ] || break
            WAIT=$((ATTEMPT * 30 + RANDOM % 60))
            echo "::warning::Modal rate-limited app creation; retrying in ${WAIT}s"
            sleep "$WAIT"
          done
          echo "::error::Modal still rate-limited app creation after 5 attempts"
          exit 1

      - name: Upload coverage reports to Codecov
        # The Triton kernels' launch code runs only here; Codecov merges this
        # report with the CPU tests' for the same commit.
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: gpu

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          flags: gpu
