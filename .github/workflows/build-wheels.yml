name: Build CPU wheels

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  resolve-legs:
    # The torch, Python and OS of each build and test job, from
    # torch_matrix.json.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      floor: ${{ steps.legs.outputs.floor }}
      newest: ${{ steps.legs.outputs.newest }}
      build_python: ${{ steps.legs.outputs.build_python }}
      build_os: ${{ steps.legs.outputs.build_os }}
      test_os: ${{ steps.legs.outputs.test_os }}
      cpu_tests: ${{ steps.legs.outputs.cpu_tests }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the legs
        id: legs
        run: python3 scripts/torch_matrix.py legs --event "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"

  # One abi3 wheel per OS, built on the floor torch and the oldest Python (its
  # wheel serves every later Python). The test jobs run it on the cpu_tests
  # legs.
  build:
    needs: resolve-legs
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.resolve-legs.outputs.build_os) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # fetch-depth: 0 required so setuptools_scm can read full
          # git history and tags to derive the package version number.

      - uses: actions/setup-python@v7
        with:
          # The interpreter cibuildwheel runs on, not the wheels' (CIBW_BUILD);
          # cibuildwheel 4 needs Python 3.11 or newer.
          python-version: "3.13"

      - name: Configure native build environment (macOS)
        # cibuildwheel builds macOS wheels on the runner (no container), so
        # env vars set here reach the build subprocess.
        if: runner.os == 'macOS'
        run: |
          # 14.0 floor: the MPS Metal kernels need a newer Metal/MPS runtime
          # than the arm64 Big Sur (11.0) default. See README.
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      - name: Install cibuildwheel
        # 4.2.0 or later builds CPython 3.15 by default. Free-threaded builds
        # are on by default too, but CIBW_BUILD below names only regular ones.
        run: pip install cibuildwheel==4.3.5

      - name: Select the Python to build on
        # Expressions have no string replace: "3.11" becomes "cp311-*".
        shell: bash
        run: echo "CIBW_BUILD=cp${PYTHON_VERSION/./}-*" >> "$GITHUB_ENV"
        env:
          PYTHON_VERSION: ${{ needs.resolve-legs.outputs.build_python }}

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          # CIBW_BUILD, the Python to build on, is set by the step above.
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # CPython's default flags include -g, and on Linux the debug info
          # lands in _C itself (about 36 of its 37 MB). Strip it at link time:
          # LDFLAGS is appended to the link command, whereas a CXXFLAGS
          # override would replace Python's flags, -O3 included.
          CIBW_ENVIRONMENT_LINUX: LDFLAGS="$LDFLAGS -Wl,--strip-debug"
          # torch (+ setuptools) are installed into the build env by
          # CIBW_BEFORE_BUILD, so disable build isolation; otherwise setup.py
          # can't `import torch` and silently builds an extension-less wheel.
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          # macOS CPU wheels on the PyTorch index aren't `+cpu`-suffixed, so
          # add the suffix only off-macOS (resolved via runner.os).
          CIBW_BEFORE_BUILD: >-
            pip install "setuptools>=77.0.3" "setuptools_scm>=8" wheel &&
            pip install torch==${{ needs.resolve-legs.outputs.floor }}${{ runner.os != 'macOS' && '+cpu' || '' }} --index-url https://download.pytorch.org/whl/cpu
          CIBW_TEST_SKIP: "*"
          # torch's libs are excluded from repair: torch is a separate runtime
          # dep (never vendored), and `import torch` loads them globally before
          # philtorch._C, so the extension resolves them at runtime. Without
          # -e, auditwheel/delocate abort not finding them on the build image.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --exclude 'libtorch*.so*' --exclude 'libc10*.so*' -w {dest_dir} {wheel}
          # --ignore-missing-dependencies: the extension names torch's libs by
          # @rpath with no rpath of its own, so delocate can't find their
          # files; they resolve at runtime to the copies `import torch` loaded.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            delocate-wheel --require-archs {delocate_archs} -e libtorch -e libc10 --ignore-missing-dependencies -w {dest_dir} -v {wheel}
          # cibuildwheel 4 repairs Windows wheels with delvewheel by default,
          # which would bundle torch's DLLs; leave them to torch, as above.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Every wheel is built against the floor torch, so this is the only job that
  # compiles against the newest one. It checks that the extension builds and
  # imports there; no tests, no artifact.
  build-newest-torch:
    needs: resolve-legs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # fetch-depth: 0 so setuptools_scm sees the tags.

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.resolve-legs.outputs.build_python }}

      - name: Install the build requirements
        run: |
          pip install "setuptools>=77.0.3" "setuptools_scm>=8" wheel
          pip install torch==${{ needs.resolve-legs.outputs.newest }}+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Build and install
        run: pip install --no-build-isolation .

      - name: Import
        # Outside the checkout, so that the installed package is imported.
        working-directory: ${{ runner.temp }}
        run: python -c "import philtorch"

  # A job of its own, not a reusable workflow's, so that its check is named
  # exactly `lint`, as the dev ruleset requires.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          # Keep in sync with ruff in pixi.toml.
          version: "0.16.9"
          args: "--version"
      - name: Lint
        run: ruff check
      - name: Check formatting
        # Run even if linting failed, so both problems are reported at once.
        if: ${{ !cancelled() }}
        run: ruff format --check

  docs:
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml

  # Releases only: the CUDA wheels, GPU-tested and attached to the release. The
  # called workflow's jobs can't exceed these permissions.
  cuda-wheels:
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/build-cuda-wheels.yml
    secrets: inherit

  # Each OS's wheel on every cpu_tests leg: a torch, maybe a later minor than
  # the wheel's, and a Python. A missing wheel (its build failed) fails the
  # leg at the download, without skipping the other OSes. The macOS runners
  # have no usable MPS (#126), so the MPS tests skip there.
  test:
    name: test ${{ matrix.os }}, torch ${{ matrix.leg.torch }}, Python ${{ matrix.leg.python }}
    needs: [resolve-legs, build]
    if: ${{ !cancelled() && needs.resolve-legs.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.resolve-legs.outputs.test_os) }}
        leg: ${{ fromJson(needs.resolve-legs.outputs.cpu_tests) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # Only the first leg, the floor torch on the build Python, on Ubuntu
      # uploads to Codecov, to avoid duplicate reports for the same commit.
      UPLOAD_COVERAGE: >-
        ${{ matrix.os == 'ubuntu-latest' &&
        matrix.leg.torch == needs.resolve-legs.outputs.floor &&
        matrix.leg.python == needs.resolve-legs.outputs.build_python }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.leg.python }}

      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse

      - name: Install wheel and test dependencies
        # Runs under bash on every OS (Windows uses bundled Git Bash). Torch is
        # installed without the "+cpu" suffix on macOS, as in the build job.
        shell: bash
        run: |
          shopt -s nullglob
          WHEELS=(wheelhouse/philtorch-*-abi3-*.whl)
          if [ "${#WHEELS[@]}" -ne 1 ]; then
            echo "Expected exactly one abi3 wheel in wheelhouse/, found ${#WHEELS[@]}: ${WHEELS[*]}" >&2
            exit 1
          fi

          pip install torch==${{ matrix.leg.torch }}${{ runner.os != 'macOS' && '+cpu' || '' }} --index-url https://download.pytorch.org/whl/cpu

          # Vendored torchlpc is now bundled in philtorch._C; no separate pip install.
          # Keep --no-deps since torch is already present.
          pip install --no-deps "${WHEELS[0]}"
          pip install numpy scipy pytest pytest-cov

      - name: Test with pytest
        run: pytest --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage reports to Codecov
        if: env.UPLOAD_COVERAGE == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        # Per-test durations and failures, for Codecov's test analytics; also
        # when tests fail.
        if: ${{ !cancelled() && env.UPLOAD_COVERAGE == 'true' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml

  build-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # fetch-depth 0 so setuptools_scm sees the tags.

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install build dependencies
        run: python -m pip install "setuptools_scm>=8" build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    # TestPyPI publishes from dev, PyPI from a supported published GitHub
    # Release, each only after every job here has passed. A release also waits
    # for the CUDA wheels to be built, tested and attached.
    needs:
      - build
      - build-newest-torch
      - build-sdist
      - lint
      - docs
      - test
      - cuda-wheels
    # `!cancelled()` lets this job run after a failed or skipped dependency, so
    # every required result is checked here. The build and test matrices hold
    # only the OSes that ran for the event, and cuda-wheels runs only for a
    # release.
    if: >
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.build-newest-torch.result == 'success' &&
      needs.build-sdist.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.docs.result == 'success' &&
      needs.test.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
        (
          github.event_name == 'release' &&
          github.event.action == 'published' &&
          (startsWith(github.event.release.tag_name, 'v0.') || startsWith(github.event.release.tag_name, 'v1.')) &&
          needs.cuda-wheels.result == 'success'
        )
      )
    permissions:
      id-token: write
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to PyPI
        if: >
          github.event_name == 'release' &&
          (startsWith(github.event.release.tag_name, 'v0.') || startsWith(github.event.release.tag_name, 'v1.'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
