name: Build CPU wheels

on:
  push:
    branches: ["dev"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  resolve-torch-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve latest 3 stable PyTorch minor versions
        id: resolve
        run: |
          python3 - <<'EOF'
          import os, urllib.request, re, json
          from packaging.version import Version

          url = "https://download.pytorch.org/whl/cpu/torch/"
          with urllib.request.urlopen(url) as r:
              html = r.read().decode()

          # Extract versions like 2.6.0, 2.7.1, etc. from wheel filenames
          versions = set(re.findall(r'torch-(\d+\.\d+\.\d+)\+cpu-', html))

          parsed = sorted({Version(v) for v in versions}, reverse=True)

          # Pick the latest patch for each minor series, take the 3 most recent minors
          seen_minor = {}
          for v in parsed:
              key = (v.major, v.minor)
              if key not in seen_minor:
                  seen_minor[key] = str(v)
          top3 = [seen_minor[k] for k in sorted(seen_minor, reverse=True)[:3]]

          matrix = json.dumps(top3)
          print(f"Resolved torch versions: {top3}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
          EOF

  build-linux:
    needs: resolve-torch-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        torch: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix) }}
        python: ["310", "311", "312", "313"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fetch-depth: 0 required so setuptools-git-versioning can read full
          # git history and tags to derive the package version number.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.23.3

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp${{ matrix.python }}-manylinux_x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_BUILD: "pip install torch==${{ matrix.torch }}+cpu --index-url https://download.pytorch.org/whl/cpu && pip install setuptools>=77.0.3 setuptools-git-versioning>=2.0 wheel"
          CIBW_TEST_SKIP: "*"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-cp${{ matrix.python }}-torch${{ matrix.torch }}
          path: wheelhouse/*.whl

  build-macos:
    needs: resolve-torch-versions
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        torch: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix) }}
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Homebrew dependencies for OpenMP
        run: brew install llvm libomp

      - name: Install torch and build dependencies
        run: |
          pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          pip install "setuptools>=77.0.3" "setuptools-git-versioning>=2.0" wheel build

      - name: Build wheel
        run: python -m build --wheel --no-isolation
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python }}-torch${{ matrix.torch }}
          path: dist/*.whl

  build-windows:
    needs: resolve-torch-versions
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        torch: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix) }}
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install torch and build dependencies
        run: |
          pip install torch==${{ matrix.torch }}+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install "setuptools>=77.0.3" "setuptools-git-versioning>=2.0" wheel build

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python }}-torch${{ matrix.torch }}
          path: dist/*.whl

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      id-token: write
    environment:
      name: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
