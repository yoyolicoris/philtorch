name: Build CPU wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      torch_version:
        description: 'Torch version to build against (e.g. 2.7.0); leave blank to build full matrix'
        required: false
        default: ''

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        torch: ["2.6.0", "2.7.0"]
        python: ["310", "311", "312", "313"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fetch-depth: 0 required so setuptools-git-versioning can read full
          # git history and tags to derive the package version number.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.23.3

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp${{ matrix.python }}-manylinux_x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_BUILD: >
            pip install torch==${{ matrix.torch }}+cpu
            --index-url https://download.pytorch.org/whl/cpu &&
            pip install setuptools>=77.0.3 setuptools-git-versioning>=2.0 wheel
          CIBW_ENVIRONMENT: >
            PHILTORCH_DISABLE_OPENMP=0
          CIBW_TEST_SKIP: "*"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-cp${{ matrix.python }}-torch${{ matrix.torch }}
          path: wheelhouse/*.whl

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        torch: ["2.6.0", "2.7.0"]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Homebrew dependencies for OpenMP
        run: brew install llvm libomp

      - name: Install torch and build dependencies
        run: |
          pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          pip install "setuptools>=77.0.3" "setuptools-git-versioning>=2.0" wheel build

      - name: Build wheel
        run: python -m build --wheel --no-isolation
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python }}-torch${{ matrix.torch }}
          path: dist/*.whl

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        torch: ["2.6.0", "2.7.0"]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install torch and build dependencies
        run: |
          pip install torch==${{ matrix.torch }}+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install "setuptools>=77.0.3" "setuptools-git-versioning>=2.0" wheel build

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python }}-torch${{ matrix.torch }}
          path: dist/*.whl

  publish:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
