name: Build CPU wheels

on:
  push:
    branches: ["dev"]
    tags:
      - "v0.*"
      - "v1.*"
  pull_request:
    branches: ["dev"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  resolve-torch-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Install packaging
        run: pip install packaging

      - name: Resolve stable PyTorch versions to build against
        id: resolve
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, re, json
          from packaging.version import Version

          url = "https://download.pytorch.org/whl/cpu/torch/"
          with urllib.request.urlopen(url) as r:
              html = r.read().decode()

          # Extract versions like 2.6.0, 2.7.1, etc. from wheel filenames
          versions = set(re.findall(r'torch-(\d+\.\d+\.\d+)\+cpu-', html))

          parsed = sorted({Version(v) for v in versions}, reverse=True)

          # Pick the latest patch for each minor series, take the 3 most recent minors
          seen_minor = {}
          for v in parsed:
              key = (v.major, v.minor)
              if key not in seen_minor:
                  seen_minor[key] = str(v)
          top3 = [seen_minor[k] for k in sorted(seen_minor, reverse=True)[:3]]

          # Building against every supported minor is expensive; PRs only need
          # a quick sanity check against the latest stable release.
          selected = top3[:1] if os.environ["GITHUB_EVENT_NAME"] == "pull_request" else top3

          matrix = json.dumps(selected)
          print(f"Resolved torch versions: {selected}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
          EOF

  # One job per OS (each calling the reusable _build-wheel.yml) rather than a
  # single os x torch matrix, so each OS gets its own conclusion and a failure
  # on one OS doesn't skip the others' downstream test/publish jobs.
  # Within each OS, strategy.matrix fans out over the resolved Torch minors
  # (latest only on pull_request; latest 3 otherwise) for build/test signal.
  # Only the wheel built against the latest minor (matrix[0]) is published; see
  # the publish job and PR #20 for why wheels can't be published per-minor.
  build-wheels-ubuntu:
    needs: resolve-torch-versions
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        torch-version: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix) }}
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: ubuntu-latest
      torch_version: ${{ matrix.torch-version }}

  # macOS runners are expensive: build/test only on pull_request and official
  # releases (v* tag push or published release), and only against the latest
  # resolved Torch minor (no matrix) since it never runs on push to dev.
  build-wheels-macos:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/')
    needs: resolve-torch-versions
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: macos-latest
      torch_version: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}

  # Windows is built (for regression signal) but never tested or published:
  # torchlpc, a mandatory runtime dep, fails to compile on MSVC, so a Windows
  # `pip install philtorch` can't work yet. Re-enable test/publish once
  # torchlpc builds on Windows. See PR #20 for details. Matrixed like ubuntu.
  build-wheels-windows:
    needs: resolve-torch-versions
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        torch-version: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix) }}
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: windows-latest
      torch_version: ${{ matrix.torch-version }}

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install flake8
        run: python -m pip install flake8

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # One test job per OS (see build-wheels-ubuntu comment), matrixed over the
  # same resolved Torch minors so each leg tests the wheel built against that
  # minor.
  test-ubuntu:
    needs: [resolve-torch-versions, build-wheels-ubuntu]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        torch-version: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix) }}
    uses: ./.github/workflows/_test-wheel.yml
    with:
      os: ubuntu-latest
      # Mirrors the CIBW_BUILD selection in _build-wheel.yml: PRs only get a
      # wheel for the latest Python, other events build/test the full range.
      python_versions: ${{ github.event_name == 'pull_request' && '["3.13"]' || '["3.10", "3.11", "3.12", "3.13"]' }}
      torch_version: ${{ matrix.torch-version }}
      # Only the leg for the latest resolved Torch minor (matrix[0]) uploads
      # coverage, to avoid duplicate reports for the same commit.
      upload_coverage: ${{ matrix.torch-version == fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  # Mirrors build-wheels-macos's condition: only pull_request and official
  # releases build a macOS wheel to test. Not matrixed over Torch versions.
  test-macos:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/')
    needs: [resolve-torch-versions, build-wheels-macos]
    permissions:
      contents: read
    uses: ./.github/workflows/_test-wheel.yml
    with:
      os: macos-latest
      python_versions: '["3.13"]'
      torch_version: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  build-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fetch-depth: 0 required so setuptools-git-versioning can read full
          # git history and tags to derive the package version number.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    # Publishing is independent of testing: only the builds, lint and sdist
    # gate publish, so a wheel that fails pytest is still publishable.
    # build-wheels-windows is required (to catch build regressions) even
    # though its wheel is never published.
    needs:
      [
        resolve-torch-versions,
        build-wheels-ubuntu,
        build-wheels-macos,
        build-wheels-windows,
        build-sdist,
        lint,
      ]
    # `!failure() && !cancelled()` instead of the implicit `success()` so the
    # always-skipped build-wheels-macos (push-to-dev) doesn't block publish,
    # while a genuine failure in any needed job still does. The release branch
    # also re-checks the tag pattern because `release: [published]` fires for
    # any tag, unlike the push-tag trigger which is already filtered.
    if: >
      !failure() && !cancelled() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'release' && github.event.action == 'published' &&
          (startsWith(github.event.release.tag_name, 'v0.') || startsWith(github.event.release.tag_name, 'v1.')))
      )
    permissions:
      id-token: write
    environment:
      name: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')) && 'pypi' || 'testpypi' }}
    steps:
      # Download wheels by explicit per-OS name (not `pattern: wheels-*`) so
      # the never-published Windows wheel is excluded, and only the wheel for
      # the latest resolved Torch minor (matrix[0]) is published.
      - name: Download Linux wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest-torch${{ fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}
          path: dist/

      # Only present when build-wheels-macos ran; a named download fails if
      # the artifact is absent, so guard with the same condition.
      - name: Download macOS wheel
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: wheels-macos-latest-torch${{ fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: >
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'release' &&
            (startsWith(github.event.release.tag_name, 'v0.') || startsWith(github.event.release.tag_name, 'v1.')))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
