name: Build CPU wheels

on:
  push:
    branches: ["dev"]
    tags:
      - "v0.*"
      - "v1.*"
  pull_request:
    branches: ["dev"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  resolve-torch-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Install packaging
        run: pip install packaging

      - name: Resolve stable PyTorch versions to build against
        id: resolve
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, re, json
          from packaging.version import Version

          url = "https://download.pytorch.org/whl/cpu/torch/"
          with urllib.request.urlopen(url) as r:
              html = r.read().decode()

          # Extract versions like 2.6.0, 2.7.1, etc. from wheel filenames
          versions = set(re.findall(r'torch-(\d+\.\d+\.\d+)\+cpu-', html))

          parsed = sorted({Version(v) for v in versions}, reverse=True)

          # Pick the latest patch for each minor series, take the 3 most recent minors
          seen_minor = {}
          for v in parsed:
              key = (v.major, v.minor)
              if key not in seen_minor:
                  seen_minor[key] = str(v)
          top3 = [seen_minor[k] for k in sorted(seen_minor, reverse=True)[:3]]

          # Building against every supported minor is expensive; PRs only need
          # a quick sanity check against the latest stable release.
          selected = top3[:1] if os.environ["GITHUB_EVENT_NAME"] == "pull_request" else top3

          matrix = json.dumps(selected)
          print(f"Resolved torch versions: {selected}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
          EOF

  build-wheels:
    needs: resolve-torch-versions
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        torch: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fetch-depth: 0 required so setuptools-git-versioning can read full
          # git history and tags to derive the package version number.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Homebrew dependencies for OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm libomp

      - name: Configure native build environment (macOS)
        # cibuildwheel builds macOS wheels directly on the runner (no
        # container), so env vars exported here are inherited by the build
        # subprocess. setup.py's get_macos_openmp_config() also configures
        # these via extra_compile_args/extra_link_args; this step is a
        # belt-and-suspenders safety net.
        if: runner.os == 'macOS'
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          LIBOMP_PREFIX="$(brew --prefix libomp)"
          echo "CXX=$LLVM_PREFIX/bin/clang++" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$LIBOMP_PREFIX/include" >> "$GITHUB_ENV"
          # lti_recur_mps_replay.mm depends on Metal/MPSGraph APIs only
          # available starting macOS 14.
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.23.3

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          # PRs only need a quick sanity check against the latest stable
          # Python; other events (push/tag/release/dispatch) build the full
          # supported range.
          CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp313-*' || 'cp310-* cp311-* cp312-* cp313-*' }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # Build deps (torch, setuptools) are installed by CIBW_BEFORE_BUILD
          # into the same env cibuildwheel builds in, so disable build
          # isolation; otherwise setup.py can't `import torch` and silently
          # produces a pure-Python (extension-less) wheel.
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          # macOS CPU wheels on the PyTorch index aren't `+cpu`-suffixed, so
          # the suffix is resolved once here (via runner.os) instead of
          # duplicating this whole command in a CIBW_BEFORE_BUILD_MACOS override.
          CIBW_BEFORE_BUILD: >-
            pip install "setuptools>=77.0.3" "setuptools-git-versioning>=2.0,<3" wheel &&
            pip install torch==${{ matrix.torch }}${{ runner.os != 'macOS' && '+cpu' || '' }} --index-url https://download.pytorch.org/whl/cpu
          CIBW_TEST_SKIP: "*"
          # torch's own shared libraries are excluded from repair: torch is a
          # separate runtime dependency (installed by users/CI alongside the
          # wheel, never vendored), and `import torch` already loads these
          # libraries into the process with global symbol visibility before
          # `philtorch._C` is imported, so the extension's references to them
          # resolve without needing a bundled copy. Without excluding them,
          # auditwheel/delocate abort because they can't locate torch's
          # libraries (which live in the separately-installed torch package,
          # not on the wheel-building image's linker search path).
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --exclude 'libtorch*.so*' --exclude 'libc10*.so*' -w {dest_dir} {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            delocate-wheel --require-archs {delocate_archs} -e libtorch -e libc10 -w {dest_dir} -v {wheel}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-torch${{ matrix.torch }}
          path: wheelhouse/*.whl

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install flake8
        run: python -m pip install flake8

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    # Reuses the wheels already produced by build-wheels instead of
    # recompiling the C++ extension from source, to save CI compute/runtime.
    # Only tests against the latest resolved torch version (not every torch
    # in build-wheels's matrix); the extension is compiled straight against
    # torch's C++ ABI, so a passing test on the latest torch is a reliable
    # proxy for the older, already-published torch minors.
    needs: [resolve-torch-versions, build-wheels]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      LATEST_TORCH: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are expensive, so macOS is only tested on pull_request;
        # other events (push/tag/release/dispatch) skip straight to ubuntu/windows.
        os: ${{ fromJson(github.event_name == 'pull_request' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
        # Mirrors the CIBW_BUILD selection in build-wheels: PRs only get a
        # wheel for the latest Python, other events build/test the full range.
        python-version: ${{ fromJson(github.event_name == 'pull_request' && '["3.13"]' || '["3.10", "3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-torch${{ env.LATEST_TORCH }}
          path: wheelhouse

      - name: Install wheel and test dependencies
        # Runs under bash on every OS (including windows-latest's bundled Git
        # Bash) for a single consistent script. No Homebrew/OpenMP setup is
        # needed on macOS: the wheel built by build-wheels is already
        # self-contained (cibuildwheel repairs macOS wheels with delocate,
        # bundling libomp). Torch is installed without a "+cpu" suffix only on
        # macOS, since macOS CPU wheels on that index aren't suffixed,
        # matching CIBW_BEFORE_BUILD in build-wheels.
        shell: bash
        run: |
          shopt -s nullglob
          PYTAG="cp$(echo "${{ matrix.python-version }}" | tr -d '.')"
          WHEELS=(wheelhouse/philtorch-*-"$PYTAG"-*.whl)
          if [ "${#WHEELS[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel matching $PYTAG in wheelhouse/, found ${#WHEELS[@]}: ${WHEELS[*]}" >&2
            exit 1
          fi
          pip install torch==${{ env.LATEST_TORCH }}${{ runner.os != 'macOS' && '+cpu' || '' }} --index-url https://download.pytorch.org/whl/cpu
          pip install "${WHEELS[0]}"
          pip install pytest scipy numpy pytest-cov

      - name: Test with pytest
        run: pytest --cov-branch --cov-report=xml

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fetch-depth: 0 required so setuptools-git-versioning can read full
          # git history and tags to derive the package version number.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist, lint, test]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'release' && github.event.action == 'published')
    permissions:
      id-token: write
    environment:
      name: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')) && 'pypi' || 'testpypi' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
