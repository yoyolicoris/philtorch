name: Build CPU wheels

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  resolve-legs:
    # The torch and Python of each build and test job, from torch_matrix.json.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      floor: ${{ steps.legs.outputs.floor }}
      build_python: ${{ steps.legs.outputs.build_python }}
      cpu_tests: ${{ steps.legs.outputs.cpu_tests }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the legs
        id: legs
        run: python3 scripts/torch_matrix.py legs --event "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"

  # One build job per OS, each calling _build-wheel.yml, so that each OS has
  # its own conclusion and one failing OS doesn't skip the others' test and
  # publish jobs. A wheel is abi3 and targets torch's stable ABI from the floor
  # (build_support.MIN_TORCH) on: each OS builds one, on the floor torch and the
  # oldest Python. The test jobs run it on the cpu_tests legs.
  build-wheels-ubuntu:
    needs: resolve-legs
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: ubuntu-latest
      torch_version: ${{ needs.resolve-legs.outputs.floor }}
      python_version: ${{ needs.resolve-legs.outputs.build_python }}

  # macOS runners are expensive: build and test only on pull requests and
  # published releases.
  build-wheels-macos:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'release'
    needs: resolve-legs
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: macos-latest
      torch_version: ${{ needs.resolve-legs.outputs.floor }}
      python_version: ${{ needs.resolve-legs.outputs.build_python }}

  build-wheels-windows:
    needs: resolve-legs
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: windows-latest
      torch_version: ${{ needs.resolve-legs.outputs.floor }}
      python_version: ${{ needs.resolve-legs.outputs.build_python }}

  # Same Ruff lint and format checks as the standalone Lint workflow, so
  # publishing is gated on them.
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/ruff.yml

  # One test job per OS, each a matrix over the cpu_tests legs: a torch and
  # the Python to run it on. Every leg installs the OS's one wheel.
  test-ubuntu:
    needs: [resolve-legs, build-wheels-ubuntu]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-legs.outputs.cpu_tests) }}
    uses: ./.github/workflows/_test-wheel.yml
    with:
      os: ubuntu-latest
      torch_version: ${{ matrix.torch }}
      python_version: ${{ matrix.python }}
      # Only the first leg, the newest torch on its Python, uploads coverage,
      # to avoid duplicate reports for the same commit.
      upload_coverage: ${{ strategy.job-index == 0 }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  # Only pull requests and published releases test a macOS wheel. The runners
  # have no usable MPS (#126), so the MPS tests skip.
  test-macos:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'release'
    needs: [resolve-legs, build-wheels-macos]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-legs.outputs.cpu_tests) }}
    uses: ./.github/workflows/_test-wheel.yml
    with:
      os: macos-latest
      torch_version: ${{ matrix.torch }}
      python_version: ${{ matrix.python }}

  # Only pull requests and published releases test a Windows wheel, with the
  # full test suite.
  test-windows:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'release'
    needs: [resolve-legs, build-wheels-windows]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-legs.outputs.cpu_tests) }}
    uses: ./.github/workflows/_test-wheel.yml
    with:
      os: windows-latest
      torch_version: ${{ matrix.torch }}
      python_version: ${{ matrix.python }}

  build-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # fetch-depth 0 so setuptools_scm sees the tags.

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install build dependencies
        run: python -m pip install "setuptools_scm>=8" build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    # TestPyPI publishes from dev after the Linux tests pass.
    # Production publishes only from a supported published GitHub Release after
    # every Linux, macOS, and Windows wheel test passes.
    needs:
      [
        build-wheels-ubuntu,
        build-wheels-macos,
        build-wheels-windows,
        build-sdist,
        lint,
        test-ubuntu,
        test-macos,
        test-windows,
      ]
    # `!cancelled()` allows the dev path to run while release-only macOS and
    # Windows test jobs are skipped, so every required result is checked here.
    if: >
      !cancelled() &&
      needs.build-wheels-ubuntu.result == 'success' &&
      needs.build-wheels-windows.result == 'success' &&
      needs.build-sdist.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-ubuntu.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
        (
          github.event_name == 'release' &&
          github.event.action == 'published' &&
          (startsWith(github.event.release.tag_name, 'v0.') || startsWith(github.event.release.tag_name, 'v1.')) &&
          needs.build-wheels-macos.result == 'success' &&
          needs.test-macos.result == 'success' &&
          needs.test-windows.result == 'success'
        )
      )
    permissions:
      id-token: write
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    steps:
      - name: Download Linux wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-ubuntu-latest
          path: dist/

      - name: Download macOS wheel
        if: >
          github.event_name == 'release' &&
          needs.build-wheels-macos.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: wheels-macos-latest
          path: dist/

      - name: Download Windows wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-windows-latest
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: >
          github.event_name == 'release' &&
          (startsWith(github.event.release.tag_name, 'v0.') || startsWith(github.event.release.tag_name, 'v1.'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
