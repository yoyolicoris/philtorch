name: Build CPU wheels

on:
  push:
    branches: ["dev"]
    tags:
      - "v0.*"
      - "v1.*"
  pull_request:
    branches: ["dev"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  resolve-torch-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Install packaging
        run: pip install packaging

      - name: Resolve stable PyTorch versions to build against
        id: resolve
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, re, json
          from packaging.version import Version

          url = "https://download.pytorch.org/whl/cpu/torch/"
          with urllib.request.urlopen(url) as r:
              html = r.read().decode()

          # Extract versions like 2.6.0, 2.7.1, etc. from wheel filenames
          versions = set(re.findall(r'torch-(\d+\.\d+\.\d+)\+cpu-', html))

          parsed = sorted({Version(v) for v in versions}, reverse=True)

          # Pick the latest patch for each minor series, take the 3 most recent minors
          seen_minor = {}
          for v in parsed:
              key = (v.major, v.minor)
              if key not in seen_minor:
                  seen_minor[key] = str(v)
          top3 = [seen_minor[k] for k in sorted(seen_minor, reverse=True)[:3]]

          # Building against every supported minor is expensive; PRs only need
          # a quick sanity check against the latest stable release.
          selected = top3[:1] if os.environ["GITHUB_EVENT_NAME"] == "pull_request" else top3

          matrix = json.dumps(selected)
          print(f"Resolved torch versions: {selected}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
          EOF

  # build-wheels is split into one job per OS (each calling the same
  # reusable workflow) instead of a single job matrixed over os x torch.
  # A matrixed job reports one aggregated conclusion for all its legs, so a
  # single OS/torch combination failing would mark the whole job "failure"
  # and (by default) skip every downstream `needs:` consumer, even for OSes
  # that built fine. Separate job ids give each OS its own conclusion, so
  # test-<os> below only ever depends on, and is skipped by, its own OS's
  # build - no `if: ${{ !cancelled() }}` workaround required.
  build-wheels-ubuntu:
    needs: resolve-torch-versions
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: ubuntu-latest
      torch_versions: ${{ needs.resolve-torch-versions.outputs.matrix }}

  # macOS runners are expensive, so macOS is only built (and tested, see
  # test-macos below) for pull_request and official-release events (a
  # v0.*/v1.* tag push, or a published GitHub release); push events to dev
  # skip straight to ubuntu/windows.
  build-wheels-macos:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/')
    needs: resolve-torch-versions
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: macos-latest
      torch_versions: ${{ needs.resolve-torch-versions.outputs.matrix }}

  build-wheels-windows:
    needs: resolve-torch-versions
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: windows-latest
      torch_versions: ${{ needs.resolve-torch-versions.outputs.matrix }}

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install flake8
        run: python -m pip install flake8

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # test is likewise split into one job per OS (see the comment on
  # build-wheels-ubuntu above): test-<os> only needs its own OS's build job,
  # so a build/test failure on one OS never skips the others.
  test-ubuntu:
    needs: [resolve-torch-versions, build-wheels-ubuntu]
    permissions:
      contents: read
    uses: ./.github/workflows/_test-wheel.yml
    with:
      os: ubuntu-latest
      # Mirrors the CIBW_BUILD selection in _build-wheel.yml: PRs only get a
      # wheel for the latest Python, other events build/test the full range.
      python_versions: ${{ github.event_name == 'pull_request' && '["3.13"]' || '["3.10", "3.11", "3.12", "3.13"]' }}
      latest_torch: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  # Mirrors build-wheels-macos's condition above: only pull_request and
  # official-release events build a macOS wheel to test against.
  test-macos:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/')
    needs: [resolve-torch-versions, build-wheels-macos]
    permissions:
      contents: read
    uses: ./.github/workflows/_test-wheel.yml
    with:
      os: macos-latest
      python_versions: '["3.13"]'
      latest_torch: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  # NOTE: torchlpc (a philtorch runtime dependency) currently fails to
  # compile on Windows/MSVC: its scan_cpu.cpp uses a variable-length array
  # (`std::pair<scalar_t, scalar_t> buffer[total_size];`), which is a
  # GCC/Clang extension, not standard C++, and MSVC rejects it with
  # "error C2131: expression did not evaluate to a constant". This is a bug
  # in torchlpc itself (unrelated to build isolation) that pre-dates this
  # workflow: the previous CI (python-package.yml) never had a Windows job,
  # so this was never previously exercised. Fixing it requires a change in
  # torchlpc's upstream repository, not this one. Because it always fails,
  # this job is intentionally left out of publish's `needs` below (unlike
  # build-wheels-windows, which does succeed and is required) so it can't
  # permanently block publishing; it still runs on every trigger so its
  # (expected) failure stays visible.
  test-windows:
    needs: [resolve-torch-versions, build-wheels-windows]
    permissions:
      contents: read
    uses: ./.github/workflows/_test-wheel.yml
    with:
      os: windows-latest
      python_versions: ${{ github.event_name == 'pull_request' && '["3.13"]' || '["3.10", "3.11", "3.12", "3.13"]' }}
      latest_torch: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  build-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fetch-depth: 0 required so setuptools-git-versioning can read full
          # git history and tags to derive the package version number.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs:
      [
        build-wheels-ubuntu,
        build-wheels-macos,
        build-wheels-windows,
        build-sdist,
        lint,
        test-ubuntu,
        test-macos,
      ]
    # test-windows is deliberately absent from `needs` above (see the NOTE on
    # that job): it always fails on a torchlpc/MSVC bug that can only be
    # fixed upstream, so requiring its success would permanently block
    # publish. build-wheels-windows (which does succeed) is still required,
    # so a real regression in philtorch's own Windows build still blocks.
    #
    # build-wheels-macos/test-macos only run for pull_request and
    # official-release events (tag push or a published GitHub release; see
    # their own `if:` above), so they're always "skipped" - not "success" -
    # on a push to dev. A bare `needs:` implies an `if: success()` default,
    # which treats a skipped need as blocking; failure()/cancelled() correctly
    # ignore it instead, while still blocking on a genuine failure in any
    # other needed job.
    if: >
      !failure() && !cancelled() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'release' && github.event.action == 'published')
      )
    permissions:
      id-token: write
    environment:
      name: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')) && 'pypi' || 'testpypi' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
