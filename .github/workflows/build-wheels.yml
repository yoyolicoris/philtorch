name: Build CPU wheels

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  resolve-torch-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      floor: ${{ steps.resolve.outputs.floor }}
      newest: ${{ steps.resolve.outputs.newest }}
      test_torches: ${{ steps.resolve.outputs.test_torches }}
      pythons: ${{ steps.resolve.outputs.pythons }}
    steps:
      - uses: actions/checkout@v7

      - name: Install packaging
        run: pip install packaging

      - name: Resolve stable PyTorch versions to build and test against
        id: resolve
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import json, os, re, tomllib, urllib.request
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          import build_support

          # PyPI's JSON API is a stable, documented contract (unlike scraping
          # download.pytorch.org's HTML directory listing), and its release
          # versions match 1:1 with the +cpu builds hosted there, so there's
          # no need to hit that index at all.
          url = "https://pypi.org/pypi/torch/json"
          req = urllib.request.Request(url, headers={"User-Agent": "philtorch-ci"})
          with urllib.request.urlopen(req) as r:
              data = json.load(r)

          # Yanked files don't count, as in scripts/update_cuda_matrix.py.
          releases = {
              v: [f for f in files if not f["yanked"]] for v, files in data["releases"].items()
          }
          versions = [
              Version(v) for v, files in releases.items() if files and not Version(v).is_prerelease
          ]
          if not versions:
              raise RuntimeError("No stable torch releases found via PyPI JSON API")
          parsed = sorted(set(versions), reverse=True)

          # The latest patch of each minor series from the floor on, newest
          # first. The wheels target the floor's stable ABI, so they load on
          # every one of these minors.
          floor = Version(build_support.MIN_TORCH)
          seen_minor = {}
          for v in parsed:
              key = (v.major, v.minor)
              if key >= (floor.major, floor.minor) and key not in seen_minor:
                  seen_minor[key] = str(v)
          if (floor.major, floor.minor) not in seen_minor:
              raise RuntimeError(f"No stable torch release found for the floor {floor}")
          minors = [seen_minor[k] for k in sorted(seen_minor, reverse=True)]
          newest, floor_torch = minors[0], minors[-1]

          # The Linux and Windows wheels build on the floor torch, the macOS
          # one (pinned to its torch minor) on the newest. Testing every minor
          # is expensive; PRs only need the newest and the floor.
          pr = os.environ["GITHUB_EVENT_NAME"] == "pull_request"
          test_torches = list(dict.fromkeys([newest, floor_torch])) if pr else minors

          # The Pythons each torch ships wheels for, from pyproject.toml's
          # requires-python on: a new torch minor can drop the oldest (torch
          # 2.15 has no 3.10 wheels) and add the newest. PyPI lists
          # free-threaded wheels under the same python_version (cp315), so
          # they need no filtering here. Each wheel builds on the oldest
          # Python of its build torch; PRs test it on the oldest and newest,
          # which catches most version-specific breakage (e.g. NumPy 2.2 being
          # the last release for 3.10, see #56); other events the full range.
          with open("pyproject.toml", "rb") as f:
              requires = SpecifierSet(tomllib.load(f)["project"]["requires-python"])
          pythons = {}
          for v in test_torches:
              cps = {
                  int(m.group(1))
                  for f in releases[v]
                  if (m := re.fullmatch(r"cp3(\d+)", f["python_version"]))
                  and f"3.{m.group(1)}" in requires
              }
              if not cps:
                  raise RuntimeError(f"torch {v} has no wheels for Python {requires}")
              available = [f"3.{m}" for m in sorted(cps)]
              pythons[v] = [available[0], available[-1]] if pr else available

          print(
              f"Floor torch {floor_torch}, newest {newest}, "
              f"test torches {test_torches}, with Pythons {pythons}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"floor={floor_torch}\n")
              f.write(f"newest={newest}\n")
              f.write(f"test_torches={json.dumps(test_torches)}\n")
              f.write(f"pythons={json.dumps(pythons)}\n")
          EOF

  # One job per OS (each calling the reusable _build-wheel.yml) so each OS
  # gets its own conclusion and a failure on one OS doesn't skip the others'
  # downstream test/publish jobs. The wheels are abi3 and target torch's
  # stable ABI from the floor (build_support.MIN_TORCH) on, so Linux and
  # Windows each build one wheel on the floor torch and the test jobs run it
  # against every torch minor from the floor to the newest. macOS builds on
  # the newest torch with the wheel pinned to its minor, as its Metal source
  # still uses the non-stable API.
  build-wheels-ubuntu:
    needs: resolve-torch-versions
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: ubuntu-latest
      python_versions: ${{ toJson(fromJson(needs.resolve-torch-versions.outputs.pythons)[needs.resolve-torch-versions.outputs.floor]) }}
      torch_version: ${{ needs.resolve-torch-versions.outputs.floor }}

  # macOS runners are expensive: build/test only on pull requests and
  # published releases.
  build-wheels-macos:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'release'
    needs: resolve-torch-versions
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: macos-latest
      python_versions: ${{ toJson(fromJson(needs.resolve-torch-versions.outputs.pythons)[needs.resolve-torch-versions.outputs.newest]) }}
      torch_version: ${{ needs.resolve-torch-versions.outputs.newest }}
      pin_torch: true

  # Windows: torchlpc is now vendored (DiffAPF/torchlpc@1bfde4a) and bundled into
  # philtorch._C, so MSVC no longer needs external torchlpc wheel. Windows is
  # built and publishable; test-windows runs smoke test.
  build-wheels-windows:
    needs: resolve-torch-versions
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: windows-latest
      python_versions: ${{ toJson(fromJson(needs.resolve-torch-versions.outputs.pythons)[needs.resolve-torch-versions.outputs.floor]) }}
      torch_version: ${{ needs.resolve-torch-versions.outputs.floor }}

  # Same Ruff lint and format checks as the standalone Lint workflow, so
  # publishing is gated on them.
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/ruff.yml

  # One test job per OS (see build-wheels-ubuntu comment). Linux and Windows
  # matrix over the resolved test torches (newest and floor on pull requests,
  # every minor otherwise), each leg installing that torch and the one wheel
  # of the OS.
  test-ubuntu:
    needs: [resolve-torch-versions, build-wheels-ubuntu]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        torch-version: ${{ fromJson(needs.resolve-torch-versions.outputs.test_torches) }}
    uses: ./.github/workflows/_test-wheel.yml
    with:
      os: ubuntu-latest
      # The Pythons to test on (see resolve-torch-versions).
      python_versions: ${{ toJson(fromJson(needs.resolve-torch-versions.outputs.pythons)[matrix.torch-version]) }}
      torch_version: ${{ matrix.torch-version }}
      # Only the leg for the newest torch uploads coverage, to avoid
      # duplicate reports for the same commit.
      upload_coverage: ${{ matrix.torch-version == needs.resolve-torch-versions.outputs.newest }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  # Mirrors build-wheels-macos: only pull_request and official releases test
  # a macOS wheel. It is pinned to the newest torch's minor, so only that torch
  # is tested.
  test-macos:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'release'
    needs: [resolve-torch-versions, build-wheels-macos]
    permissions:
      contents: read
    uses: ./.github/workflows/_test-wheel.yml
    with:
      os: macos-latest
      python_versions: ${{ toJson(fromJson(needs.resolve-torch-versions.outputs.pythons)[needs.resolve-torch-versions.outputs.newest]) }}
      torch_version: ${{ needs.resolve-torch-versions.outputs.newest }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  # Mirrors build-wheels-macos: only pull_request and official releases test
  # a Windows wheel, matrixed over the test torches like ubuntu.
  test-windows:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'release'
    needs: [resolve-torch-versions, build-wheels-windows]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        torch-version: ${{ fromJson(needs.resolve-torch-versions.outputs.test_torches) }}
    uses: ./.github/workflows/_test-wheel.yml
    with:
      os: windows-latest
      python_versions: ${{ toJson(fromJson(needs.resolve-torch-versions.outputs.pythons)[matrix.torch-version]) }}
      torch_version: ${{ matrix.torch-version }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  build-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # fetch-depth 0 so setuptools_scm sees the tags.

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install build dependencies
        run: python -m pip install "setuptools_scm>=8" build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    # TestPyPI publishes from dev after the Linux smoke tests pass.
    # Production publishes only from a supported published GitHub Release after
    # every Linux, macOS, and Windows wheel smoke test passes.
    needs:
      [
        build-wheels-ubuntu,
        build-wheels-macos,
        build-wheels-windows,
        build-sdist,
        lint,
        test-ubuntu,
        test-macos,
        test-windows,
      ]
    # `!cancelled()` allows the dev path to run while release-only macOS and
    # Windows test jobs are skipped, so every required result is checked here.
    if: >
      !cancelled() &&
      needs.build-wheels-ubuntu.result == 'success' &&
      needs.build-wheels-windows.result == 'success' &&
      needs.build-sdist.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test-ubuntu.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
        (
          github.event_name == 'release' &&
          github.event.action == 'published' &&
          (startsWith(github.event.release.tag_name, 'v0.') || startsWith(github.event.release.tag_name, 'v1.')) &&
          needs.build-wheels-macos.result == 'success' &&
          needs.test-macos.result == 'success' &&
          needs.test-windows.result == 'success'
        )
      )
    permissions:
      id-token: write
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    steps:
      - name: Download Linux wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-ubuntu-latest
          path: dist/

      - name: Download macOS wheel
        if: >
          github.event_name == 'release' &&
          needs.build-wheels-macos.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: wheels-macos-latest
          path: dist/

      - name: Download Windows wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-windows-latest
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: >
          github.event_name == 'release' &&
          (startsWith(github.event.release.tag_name, 'v0.') || startsWith(github.event.release.tag_name, 'v1.'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
