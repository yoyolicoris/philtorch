name: Build CPU wheels

on:
  push:
    branches: ["dev"]
    tags:
      - "v0.*"
      - "v1.*"
  pull_request:
    branches: ["dev"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  resolve-torch-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Install packaging
        run: pip install packaging

      - name: Resolve stable PyTorch versions to build against
        id: resolve
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, re, json
          from packaging.version import Version

          url = "https://download.pytorch.org/whl/cpu/torch/"
          with urllib.request.urlopen(url) as r:
              html = r.read().decode()

          # Extract versions like 2.6.0, 2.7.1, etc. from wheel filenames
          versions = set(re.findall(r'torch-(\d+\.\d+\.\d+)\+cpu-', html))

          parsed = sorted({Version(v) for v in versions}, reverse=True)

          # Pick the latest patch for each minor series, take the 3 most recent minors
          seen_minor = {}
          for v in parsed:
              key = (v.major, v.minor)
              if key not in seen_minor:
                  seen_minor[key] = str(v)
          top3 = [seen_minor[k] for k in sorted(seen_minor, reverse=True)[:3]]

          # Building against every supported minor is expensive; PRs only need
          # a quick sanity check against the latest stable release.
          selected = top3[:1] if os.environ["GITHUB_EVENT_NAME"] == "pull_request" else top3

          matrix = json.dumps(selected)
          print(f"Resolved torch versions: {selected}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
          EOF

  # build-wheels is split into one job per OS (each calling the same
  # reusable workflow) instead of a single job matrixed over os x torch.
  # A matrixed job reports one aggregated conclusion for all its legs, so a
  # single OS/torch combination failing would mark the whole job "failure"
  # and (by default) skip every downstream `needs:` consumer, even for OSes
  # that built fine. Separate job ids give each OS its own conclusion, so
  # test-<os> below only ever depends on, and is skipped by, its own OS's
  # build - no `if: ${{ !cancelled() }}` workaround required.
  #
  # Within a single OS's job, `strategy.matrix` fans out over every Torch
  # minor resolve-torch-versions resolved (only the latest on pull_request;
  # the latest 3 stable minors otherwise) - so on pull_request this is a
  # single leg, same as before, but on push/tag/release/dispatch every
  # resolved Torch minor is actually compiled and tested against (see
  # _test-wheel.yml), not just the latest. This is deliberately about
  # build/test signal, not about publishing more artifacts: wheel filenames
  # don't encode the Torch version they were built against, so only the
  # wheel built against the latest resolved minor (matrix[0]) is ever
  # downloaded and published (see the publish job below) - PyPI can't host
  # multiple files with the same name, and local version identifiers like
  # `+torch2.7` are rejected by PyPI uploads. Building/testing against the
  # older resolved minors too exists to catch source-level incompatibilities
  # early (there's no Torch ABI-stable API in use, and `pip install
  # --no-binary` from-source installs may use an older Torch than the one
  # published wheels are compiled against).
  build-wheels-ubuntu:
    needs: resolve-torch-versions
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        torch-version: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix) }}
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: ubuntu-latest
      torch_version: ${{ matrix.torch-version }}

  # macOS runners are expensive, so macOS is only built (and tested, see
  # test-macos below) for pull_request and official-release events (a
  # v0.*/v1.* tag push, or a published GitHub release); push events to dev
  # skip straight to ubuntu/windows. Unlike build-wheels-ubuntu/-windows
  # above, macOS is intentionally kept to a single (the latest resolved)
  # Torch minor rather than matrixed - it's never built on a push to dev at
  # all, so there's no "check the commit status for every Torch minor"
  # motivation to extend to macOS the way there is for ubuntu/windows.
  build-wheels-macos:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/')
    needs: resolve-torch-versions
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: macos-latest
      torch_version: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}

  # NOTE: torchlpc (a philtorch runtime dependency) currently fails to
  # compile on Windows/MSVC: its scan_cpu.cpp uses a variable-length array
  # (`std::pair<scalar_t, scalar_t> buffer[total_size];`), which is a
  # GCC/Clang extension, not standard C++, and MSVC rejects it with
  # "error C2131: expression did not evaluate to a constant". This is a bug
  # in torchlpc itself (unrelated to build isolation), and fixing it requires
  # a change in torchlpc's upstream repository, not this one. Because
  # `pip install philtorch` on Windows would therefore successfully install
  # this wheel and then fail entirely trying to build its mandatory
  # torchlpc dependency, there is deliberately no test-windows job (a Windows
  # pytest run can never pass) and no Windows wheel is ever published (see
  # publish's dist/ download steps below) or advertised as supported in
  # README.md. This build job is kept (and still required by publish) purely
  # so a philtorch-side regression in the Windows build itself is still
  # caught; re-enable testing/publishing here once torchlpc is installable
  # on Windows. Matrixed the same way as build-wheels-ubuntu above, for the
  # same reason (source-level build signal against every resolved minor).
  build-wheels-windows:
    needs: resolve-torch-versions
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        torch-version: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix) }}
    uses: ./.github/workflows/_build-wheel.yml
    with:
      os: windows-latest
      torch_version: ${{ matrix.torch-version }}

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install flake8
        run: python -m pip install flake8

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # test is likewise split into one job per OS (see the comment on
  # build-wheels-ubuntu above): test-<os> only needs its own OS's build job,
  # so a build/test failure on one OS never skips the others. Matrixed over
  # the same resolved Torch versions as build-wheels-ubuntu, so each leg
  # tests the wheel actually built against that same Torch minor (see
  # _test-wheel.yml) - a real per-version compatibility check, not a
  # cross-install of a mismatched wheel/Torch pair.
  test-ubuntu:
    needs: [resolve-torch-versions, build-wheels-ubuntu]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        torch-version: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix) }}
    uses: ./.github/workflows/_test-wheel.yml
    with:
      os: ubuntu-latest
      # Mirrors the CIBW_BUILD selection in _build-wheel.yml: PRs only get a
      # wheel for the latest Python, other events build/test the full range.
      python_versions: ${{ github.event_name == 'pull_request' && '["3.13"]' || '["3.10", "3.11", "3.12", "3.13"]' }}
      torch_version: ${{ matrix.torch-version }}
      # Only the leg testing the latest resolved Torch minor (matrix[0])
      # uploads coverage - otherwise every Torch-version leg's Python 3.13
      # run would each upload a report for the same commit.
      upload_coverage: ${{ matrix.torch-version == fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  # Mirrors build-wheels-macos's condition above: only pull_request and
  # official-release events build a macOS wheel to test against. Not
  # matrixed over Torch versions, since build-wheels-macos isn't either (see
  # its own comment above).
  test-macos:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/')
    needs: [resolve-torch-versions, build-wheels-macos]
    permissions:
      contents: read
    uses: ./.github/workflows/_test-wheel.yml
    with:
      os: macos-latest
      python_versions: '["3.13"]'
      torch_version: ${{ fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  build-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fetch-depth: 0 required so setuptools-git-versioning can read full
          # git history and tags to derive the package version number.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    # test-ubuntu/test-macos are deliberately absent from `needs` above:
    # publishing and testing are independent, so a wheel that fails its
    # pytest run (on either OS) must still be publishable - only the builds
    # themselves (and lint, and the sdist) gate publish. test-windows doesn't
    # exist at all (see the NOTE on build-wheels-windows above);
    # build-wheels-windows (which does succeed) is still required, so a real
    # regression in philtorch's own Windows build still blocks - even though
    # its wheel is never actually published (see the download steps below).
    needs:
      [
        resolve-torch-versions,
        build-wheels-ubuntu,
        build-wheels-macos,
        build-wheels-windows,
        build-sdist,
        lint,
      ]
    # build-wheels-macos only runs for pull_request and official-release
    # events (tag push or a published GitHub release; see its own `if:`
    # above), so it's always "skipped" - not "success" - on a push to dev. A
    # bare `needs:` implies an `if: success()` default, which treats a
    # skipped need as blocking; failure()/cancelled() correctly ignore it
    # instead, while still blocking on a genuine failure in any other needed
    # job.
    #
    # The release branch below additionally requires the release's tag to
    # look like a version tag (v0.*/v1.*): unlike the push-tag branch, whose
    # v0.*/v1.* pattern is already enforced by this workflow's top-level
    # `on.push.tags` trigger filter, `release: types: [published]` fires for
    # a GitHub Release against *any* tag, so without this check a release
    # created against an arbitrary/non-version tag would still publish to
    # real PyPI.
    if: >
      !failure() && !cancelled() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'release' && github.event.action == 'published' &&
          (startsWith(github.event.release.tag_name, 'v0.') || startsWith(github.event.release.tag_name, 'v1.')))
      )
    permissions:
      id-token: write
    environment:
      name: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')) && 'pypi' || 'testpypi' }}
    steps:
      # Downloaded by explicit per-OS artifact name (rather than the
      # previous `pattern: wheels-*` + `merge-multiple: true`) so the
      # Windows wheel is never included here: torchlpc (philtorch's
      # mandatory runtime dependency) currently fails to build on Windows
      # (see the NOTE on build-wheels-windows above), so `pip install
      # philtorch` would succeed at installing this wheel and then fail
      # entirely on its dependencies. Windows is intentionally not
      # advertised as a supported wheel platform until that's fixed
      # upstream. Only the wheel built against the latest resolved Torch
      # minor (matrix[0]) is downloaded here - build-wheels-ubuntu also
      # built (and test-ubuntu tested) the other resolved minors, but their
      # artifacts are only signal for that commit's status checks, not
      # meant to be published (see build-wheels-ubuntu's comment above).
      - name: Download Linux wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest-torch${{ fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}
          path: dist/

      # Only downloaded when build-wheels-macos actually ran (see its own
      # `if:` above); a named download-artifact fails if the artifact
      # doesn't exist, unlike the previous pattern-based download which
      # silently matched zero files on a push-to-dev event.
      - name: Download macOS wheel
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: wheels-macos-latest-torch${{ fromJson(needs.resolve-torch-versions.outputs.matrix)[0] }}
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: >
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'release' &&
            (startsWith(github.event.release.tag_name, 'v0.') || startsWith(github.event.release.tag_name, 'v1.')))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
