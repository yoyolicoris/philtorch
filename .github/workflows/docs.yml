name: Docs

# Build the docs as Read the Docs does, with warnings as errors, on changes to
# the docs or the package. Check external links weekly, so a site that is down
# for a moment doesn't fail ordinary pull requests.
on:
  push:
    branches: ["dev"]
    paths:
      - "docs/**"
      - "philtorch/**"
      - "README.md"
      - "pyproject.toml"
      - "setup.py"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["dev"]
    paths:
      - "docs/**"
      - "philtorch/**"
      - "README.md"
      - "pyproject.toml"
      - "setup.py"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install a CPU build of PhilTorch with the docs dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "setuptools>=77.0.3" "setuptools_scm>=8" wheel ninja
          python -m pip install --no-build-isolation --editable ".[docs]"

      - name: Build the docs
        if: github.event_name != 'schedule'
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Check external links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
