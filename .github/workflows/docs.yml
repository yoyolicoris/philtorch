name: Docs

# Build the docs as Read the Docs does, with warnings as errors. build-wheels.yml
# calls this workflow on every pull request and push to dev, and before a
# release publishes. Check external links weekly, so a site that is down for a
# moment doesn't fail ordinary pull requests.
on:
  workflow_call:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install a CPU build of PhilTorch with the docs dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "setuptools>=77.0.3" "setuptools_scm>=8" wheel ninja
          python -m pip install --no-build-isolation --editable .
          python -m pip install -r docs/requirements.txt

      - name: Build the docs
        if: github.event_name != 'schedule'
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Check external links
        # On this workflow's own runs only (scheduled or manual): when
        # build-wheels.yml calls it, github.workflow is the caller's name.
        if: github.workflow == 'Docs'
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
