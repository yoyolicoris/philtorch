# Manual PR review: runs only when a maintainer comments `/review` on a PR.
# Gated to users who can write to the repo, so nobody else can spend the
# maintainer's API credits. Nothing runs automatically: no trigger on PR
# open, push, or reopen.
name: opencode-command

on:
  issue_comment:
    types: [created]

jobs:
  command:
    # Only run on an explicit /review on a pull request, and only for users
    # who can write to the repo (maintainers). This gates the review behind
    # a human.
    if: |
      contains(github.event.comment.body, '/review') &&
      github.event.issue.pull_request != null &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write   # to post the review comment
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # full history so the review agent can diff against base
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: model_api/muse-spark-1.3-contributor
          agent: review
          use_github_token: true
