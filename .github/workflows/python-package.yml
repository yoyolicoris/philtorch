# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" # caching pip dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project dependencies
        run: |
          pip install -e .[dev] --no-build-isolation
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: |
          pytest --cov-branch --cov-report=xml

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native build dependencies
        run: |
          brew install llvm libomp
      - name: Configure native build environment
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          LIBOMP_PREFIX="$(brew --prefix libomp)"
          echo "CXX=$LLVM_PREFIX/bin/clang++" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$LIBOMP_PREFIX/include" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
      - name: Install torch and build
        run: |
          pip install torch
          TORCH_LIB="$(python -c 'from pathlib import Path; import torch; print(Path(torch.__file__).parent / "lib")')"
          export LDFLAGS="-L$TORCH_LIB -Wl,-rpath,$TORCH_LIB"
          pip install -e .[dev] --no-build-isolation
      - name: Verify extension op dispatch on macOS
        run: |
          python - <<'PY'
          import torch
          import philtorch
          A = torch.eye(2, dtype=torch.float64).unsqueeze(0).expand(4, -1, -1).contiguous()
          zi = torch.zeros(1, 2, dtype=torch.float64)
          x = torch.randn(1, 3, 2, dtype=torch.float64)
          y = torch.ops.philtorch.recur2(A, zi, x)
          assert y.shape == x.shape
          print("philtorch extension op recur2 works:", y.shape)
          PY
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: |
          pytest
