name: Update for PyTorch releases

on:
  schedule:
    # Mondays: wheels reach PyPI before the release notes are published, so a
    # release can take a few runs to show up in both jobs.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Both jobs rewrite shared state (a branch and a pull request, an issue).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    # Regenerates the CUDA wheel matrix and what is derived from it, and
    # proposes the result in a pull request. It never merges anything.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: bot/pytorch-update
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Update the CUDA wheel matrix
        run: python3 scripts/update_cuda_matrix.py

      - name: Commit and open or update the pull request
        env:
          # The default token: pull requests it opens start no workflows. Close
          # and reopen the pull request to run CI. Needs "Allow GitHub Actions
          # to create and approve pull requests" in the repository's Actions
          # settings.
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number // empty')"
          if [ -z "$(git status --porcelain)" ]; then
            # dev is current, so an open pull request is stale.
            if [ -n "$number" ]; then
              gh pr close "$number" --comment "Nothing to update: dev is current."
            fi
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "ci: update the CUDA wheel matrix for new PyTorch releases"

          # The branch is regenerated from dev, but pushed only when its tree
          # differs: a new commit would detach the CI run started on the old one.
          same=false
          if git fetch -q origin "$BRANCH" 2>/dev/null \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            same=true
          fi
          title="ci: update the CUDA wheel matrix for new PyTorch releases"
          if $same && [ -n "$number" ]; then
            echo "Branch and pull request are up to date."
            exit 0
          fi
          $same || git push --force origin "$BRANCH"

          cat > "$RUNNER_TEMP/body.md" <<EOF
          Generated by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) of the \`$GITHUB_WORKFLOW\` workflow.

          Check before merging:

          - the diff of \`cuda_wheel_matrix.json\`, \`pyproject.toml\` and the README table;
          - the places that name the oldest Python, when \`requires-python\` rises;
          - that the new \`build_image\`, if it changed, has the new CPython (the CUDA build fails otherwise).

          CI doesn't start on pull requests opened by a workflow: close and reopen this pull request to run it.
          EOF
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base dev --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

  impact:
    # Opens an issue on what a new PyTorch release means for PhilTorch. It
    # edits no files. Its summary comes from GitHub Copilot CLI, run without
    # tools on the release notes, if the COPILOT_GITHUB_TOKEN secret
    # (a fine-grained personal access token with the "Copilot Requests"
    # permission) is set. Without it, the issue is opened without a summary;
    # if Copilot fails, no issue is opened and the next run tries again. Each
    # step gets only the credential it needs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      COPILOT_VERSION: "1.0.98"
      COPILOT_MODEL: ${{ vars.COPILOT_MODEL || 'auto' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the release and write the prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pytorch_release_impact.py --prepare "$RUNNER_TEMP/impact"

      - name: Summarize the notes with Copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          dir="$RUNNER_TEMP/impact"
          if [ ! -f "$dir/prompt.md" ] || [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            exit 0
          fi
          # A fresh empty directory (-C), no tools, no MCP servers, no custom
          # instructions: Copilot can only return text. The prompt goes in the
          # argument (at most about 100 KB), as piped input is ignored with -p.
          mkdir "$dir/empty"
          if npm install -g "@github/copilot@$COPILOT_VERSION" \
            && copilot -C "$dir/empty" -p "$(cat "$dir/prompt.md")" -s \
              --model "$COPILOT_MODEL" --available-tools=none \
              --deny-tool=shell --deny-tool=write --deny-tool=url \
              --disable-builtin-mcps --no-ask-user --no-custom-instructions \
              --no-auto-update > "$dir/summary.md"; then
            :
          else
            # No issue this run, so the next one tries again.
            echo "::error::The Copilot step failed."
            exit 1
          fi

      - name: Open the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/impact"
          if [ -f "$dir/meta.json" ]; then
            python3 scripts/pytorch_release_impact.py --post "$dir" --summary-file "$dir/summary.md"
          fi
