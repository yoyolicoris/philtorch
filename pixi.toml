[workspace]
authors = ["Chin-Yun Yu <chin-yun.yu@qmul.ac.uk>"]
channels = ["https://prefix.dev/conda-forge", "nvidia"]
name = "philtorch"
platforms = [{ platform = "linux-64", cuda = "13" }, "osx-arm64"]

[dependencies]
ninja = ">=1.13.2,<2"
scipy = "*"
pytest = ">=9.0.2,<10"
pytest-cov = ">=7.0.0,<8"
jupyter = ">=1.1.1,<2"
matplotlib = ">=3.10.8,<4"
tqdm = ">=4.67.3,<5"
# Keep in sync with the version in .github/workflows/ruff.yml.
ruff = "==0.16.9"
# Docs toolchain; keep in sync with docs/requirements.txt.
sphinx = ">=9.1,<10"
myst-parser = ">=5,<6"
pydata-sphinx-theme = ">=0.22,<1"

[target.linux-64.dependencies]
cuda-version = ">=13.0,<14"
pytorch-gpu = ">=2.13,<3"
cuda = { version = ">=13.0,<14", channel = "nvidia" }

[target.linux-64.activation.env]
# Triton looks for ptxas-blackwell for sm_100+ GPUs; the CUDA ptxas here supports them.
TRITON_PTXAS_BLACKWELL_PATH = "$CONDA_PREFIX/bin/ptxas"

[pypi-dependencies]
setuptools_scm = ">=8, <9"
philtorch = { path = ".", editable = true }
kazane = ">=1.0.4, <2"
helion = ">=1.0.0, <2"


[target.osx-arm64.dependencies]
pytorch-cpu = ">=2.13,<3"

[pypi-options]
no-build-isolation = true

[tasks]
# Build the docs as CI and Read the Docs do, with warnings as errors.
docs = "sphinx-build -W --keep-going -b html docs docs/_build/html"
docs-linkcheck = "sphinx-build -b linkcheck docs docs/_build/linkcheck"
