[build-system]
requires = ["setuptools >= 77.0.3", "setuptools_scm >= 8", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[tool.setuptools_scm]
fallback_version = "0.4"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "philtorch/_version.py"

[tool.setuptools.package-data]
philtorch = ["VERSION.txt"]

[tool.setuptools.packages.find]
where = ["."]
# Namespace discovery is on by default here, so without this every directory
# (examples, scripts, third_party, ...) is packaged and installed as a
# top-level entry in site-packages.
include = ["philtorch", "philtorch.*"]
exclude = ["philtorch.csrc"]

[tool.setuptools]
zip-safe = false
# Ship only the package data listed above. The extension sources under csrc/
# are compiled into _C, and with automatic inclusion setuptools would also
# warn that philtorch.csrc looks importable but is not packaged.
include-package-data = false

[project]
# Dependencies come from setup.py, so CUDA wheels can pin the torch minor
# they were built against (see build_support.torch_requirement).
dynamic = ["version", "dependencies"]
name = "philtorch"
requires-python = ">=3.10"
authors = [{ name = "Chin-Yun Yu", email = "chin-yun.yu@qmul.ac.uk" }]
maintainers = [{ name = "Chin-Yun Yu", email = "chin-yun.yu@qmul.ac.uk" }]
description = "A PyTorch library for time-varying IIR filters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest >= 6.0", "scipy", "numpy", "pytest-cov"]
extra = ["helion>=1.0.0,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    # importlib mode keeps the source checkout off sys.path so CI imports the
    # installed wheel's philtorch (with its compiled extension), not the local
    # source. See PR #20 for the full rationale.
    "--import-mode=importlib",
    # `--cov` (no target) + [tool.coverage.run] source_pkgs below, so coverage
    # measures the imported philtorch package instead of the ./philtorch dir.
    "--cov",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
relative_files = true
# Measure the imported philtorch package (the installed wheel in CI), not the
# ./philtorch source dir that a bare `--cov=philtorch` would resolve to and
# report as 0% since the wheel's copy is what actually executes.
source_pkgs = ["philtorch"]

[tool.coverage.paths]
# CI tests the pre-built wheel (installed into site-packages) instead of an
# editable checkout, so map both locations to the same source for reporting.
source = ["philtorch/", "*/site-packages/philtorch/"]

[tool.ruff]
# CI and pixi pin 0.16.9; formatting style can change between minor releases.
required-version = ">=0.16,<0.17"
line-length = 100
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
